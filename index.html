<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORILO Agency</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Inter,sans-serif; }

body { color:white; overflow-x:hidden; background:#020617; }

/* VIDEO BG */
video {
  position:fixed;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
}
.overlay {
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  z-index:-1;
}

/* SECTION */
.section {
  padding:120px 20px;
  max-width:1000px;
  margin:auto;
  opacity:0;
  transform:translateY(40px);
  transition:all 0.8s ease;
}
.section.show {
  opacity:1;
  transform:translateY(0);
}

/* HERO */
.hero {
  text-align:center;
  padding-top:180px;
}
.hero h1 {
  font-size:48px;
}
.hero p {
  opacity:0.7;
  margin-top:10px;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
}

.card {
  padding:20px;
  background:rgba(255,255,255,0.05);
  border-radius:14px;
  transition:0.3s;
}
.card:hover {
  transform:translateY(-5px);
  background:rgba(255,255,255,0.1);
}

/* CTA */
.cta {
  text-align:center;
}
.cta button {
  padding:12px 24px;
  border:none;
  border-radius:8px;
  background:#6366f1;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
  <source src="bg.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<!-- HERO -->
<div class="section hero show">
  <h1>ORILO Creative Agency</h1>
  <p>Building multi-brand digital ecosystem</p>
</div>

<!-- ABOUT -->
<div class="section">
  <h2>About</h2>
  <p>We create brands, experiences, and digital systems that scale.</p>
</div>

<!-- BRANDS -->
<div class="section">
  <h2>Our Brands</h2>
  <div class="grid">
    <a href="sakawiji.html" class="card">SakaWiji</a>
    <a href="kitchenix.html" class="card">Kitchenix</a>
    <a href="pixora.html" class="card">Pixora</a>
    <a href="ngemilo.html" class="card">Ngemilo</a>
    <a href="arcteak.html" class="card">Arcteak</a>
  </div>
</div>

<!-- SERVICES -->
<div class="section">
  <h2>Services</h2>
  <div class="grid">
    <div class="card">Brand Identity</div>
    <div class="card">Web Design</div>
    <div class="card">Creative Direction</div>
  </div>
</div>

<!-- CTA -->
<div class="section cta">
  <h2>Let’s Build Something Big</h2>
  <button>Contact Us</button>
</div>

<script>
const sections = document.querySelectorAll(".section");

window.addEventListener("scroll", () => {
  sections.forEach(sec => {
    const top = sec.getBoundingClientRect().top;
    if(top < window.innerHeight - 100){
      sec.classList.add("show");
    }
  });
});
</script>

</body>
</html>
