<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORILO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  color: white;
  overflow-x: hidden;
}

/* VIDEO BACKGROUND */
video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: -1;
}

/* CONTAINER */
.container {
  max-width: 700px;
  margin: auto;
  padding: 80px 20px;
  animation: fadeIn 1s ease;
}

/* CARD */
.card {
  display: block;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 14px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  text-decoration: none;
  color: white;
  transition: 0.4s;
}

.card:hover {
  transform: scale(1.05);
  background: rgba(255,255,255,0.1);
}

/* FADE OUT */
.fade-out {
  opacity: 0;
  transition: opacity 0.5s ease;
}

/* ANIMATION */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<video autoplay muted loop>
  <source src="bg.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="container" id="page">

  <h1>ORILO Ecosystem</h1>

  <a href="sakawiji.html" class="card">SakaWiji</a>
  <a href="kitchenix.html" class="card">Kitchenix</a>
  <a href="pixora.html" class="card">Pixora</a>
  <a href="ngemilo.html" class="card">Ngemilo</a>
  <a href="arcteak.html" class="card">Arcteak</a>

</div>

<script>
document.querySelectorAll("a").forEach(link => {
  link.addEventListener("click", function(e) {
    e.preventDefault();
    document.getElementById("page").classList.add("fade-out");

    setTimeout(() => {
      window.location = this.href;
    }, 400);
  });
});
</script>

</body>
</html>
