<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ORILO - Creative Pulse</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      cursor: none;
    }

    body {
      background: linear-gradient(270deg, #0f172a, #020617, #1e293b);
      background-size: 600% 600%;
      animation: gradientMove 12s ease infinite;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 720px;
      padding: 30px;
      animation: fadeIn 1s ease;
    }

    .header {
      text-align: center;
      margin-bottom: 50px;
    }

    .logo {
      font-size: 13px;
      letter-spacing: 4px;
      opacity: 0.6;
    }

    .title {
      font-size: 40px;
      font-weight: 600;
      margin-top: 10px;
    }

    .subtitle {
      font-size: 14px;
      opacity: 0.5;
      margin-top: 6px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: #fff;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(14px);
      transition: all 0.4s ease;
      border: 1px solid rgba(255,255,255,0.08);
      transform: translateY(20px);
      opacity: 0;
      animation: cardFade 0.6s forwards;
    }

    .card:nth-child(1) { animation-delay: 0.2s; }
    .card:nth-child(2) { animation-delay: 0.3s; }
    .card:nth-child(3) { animation-delay: 0.4s; }
    .card:nth-child(4) { animation-delay: 0.5s; }
    .card:nth-child(5) { animation-delay: 0.6s; }

    .card:hover {
      transform: translateY(-10px) scale(1.04);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 0 40px rgba(99,102,241,0.5);
    }

    .card-title {
      font-size: 18px;
      font-weight: 500;
    }

    .card-desc {
      font-size: 13px;
      opacity: 0.6;
      margin-top: 6px;
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
      opacity: 0.4;
    }

    /* Custom cursor */
    .cursor {
      width: 20px;
      height: 20px;
      border: 2px solid #6366f1;
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease;
      z-index: 999;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes cardFade {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>

<body>

<div class="cursor" id="cursor"></div>

<div class="container">

  <div class="header">
    <div class="logo">ORILO</div>
    <div class="title">Creative Ecosystem</div>
    <div class="subtitle">Multi-brand digital universe</div>
  </div>

  <a href="sakawiji.html" class="card">
    <div class="card-title">SakaWiji</div>
    <div class="card-desc">Creative identity & philosophy</div>
  </a>

  <a href="kitchenix.html" class="card">
    <div class="card-title">Kitchenix</div>
    <div class="card-desc">Culinary innovation</div>
  </a>

  <a href="pixora.html" class="card">
    <div class="card-title">Pixora</div>
    <div class="card-desc">Visual & digital design</div>
  </a>

  <a href="ngemilo.html" class="card">
    <div class="card-title">Ngemilo</div>
    <div class="card-desc">Snack & lifestyle brand</div>
  </a>

  <a href="arcteak.html" class="card">
    <div class="card-title">Arcteak</div>
    <div class="card-desc">Woodcraft & furniture</div>
  </a>

  <div class="footer">
    © 2026 ORILO — Built like a beast ⚡
  </div>

</div>

<script>
  const cursor = document.getElementById("cursor");

  document.addEventListener("mousemove", (e) => {
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";
  });

  document.querySelectorAll(".card").forEach(card => {
    card.addEventListener("mouseenter", () => {
      cursor.style.transform = "translate(-50%, -50%) scale(1.8)";
    });
    card.addEventListener("mouseleave", () => {
      cursor.style.transform = "translate(-50%, -50%) scale(1)";
    });
  });
</script>

</body>
</html>
