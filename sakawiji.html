<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SakaWiji</title>

<style>
body {
  margin:0;
  font-family: Inter, sans-serif;
  color: white;
}

video {
  position: fixed;
  width:100%;
  height:100%;
  object-fit: cover;
  z-index:-2;
}

.overlay {
  position: fixed;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.6);
  z-index:-1;
}

.section {
  padding: 120px 40px;
  max-width: 800px;
  margin:auto;
  opacity:0;
  transform: translateY(40px);
  transition: all 0.8s ease;
}

.section.show {
  opacity:1;
  transform: translateY(0);
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
  <source src="sakawiji.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="section">SakaWiji — Philosophy of creation</div>
<div class="section">Rooted in simplicity & meaning</div>

<script>
const sections = document.querySelectorAll(".section");

window.addEventListener("scroll", () => {
  sections.forEach(sec => {
    const top = sec.getBoundingClientRect().top;
    if(top < window.innerHeight - 100){
      sec.classList.add("show");
    }
  });
});
</script>

</body>
</html>
